# Builds the Windows app and publishes it as a GitHub release when a version
# tag is pushed (git tag v0.2.0 && git push origin v0.2.0). The tag is the
# version: the app is built with TT_VERSION set to it, and Settings > Updates
# in every released copy finds the new release and installs it in one click
# (crates/tt_app/src/update.rs). Run it by hand for an existing tag from
# Actions > Release > Run workflow.
#
# Every merge into main builds the same way without publishing: that keeps
# the build cache on main, which every tag can read (a cache saved by a tag
# is for that tag alone, so each release used to build all ~270 crates). A
# release then compiles only the app's own crates.
#
# The zip holds trackertools.exe alone (the updater installs from it): FFmpeg
# isn't bundled, the app sets it up on its first start (tt_app::setup).
#
# A release also builds the Mac's (Apple silicon) download,
# trackertools-macos-arm64.zip, with scripts/package_macos.sh. Only for a
# release, and it can't stop the Windows one: macOS runner minutes may not be
# available to this repository's account (the macOS workflow's first runs
# stopped within seconds, before any step).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # (Not for a merge that only changes documents. Tags always run.)
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (it must exist), e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # A release: a tag (or one asked for by hand). Else a build of main to fill the cache.
      RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: Rust 1.95
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved by main only: releases read it, and don't each keep a copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        shell: pwsh
        run: |
          if ($env:RELEASE -eq 'true') { $env:TT_VERSION = $env:TAG }
          # The C runtime linked in: it runs without the Visual C++ redistributable.
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build -p tt_app --release
      - name: Package
        if: env.RELEASE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item target/release/trackertools.exe pkg/
          Compress-Archive -Path pkg/* -DestinationPath trackertools-windows-x64.zip
          # Its SHA-256 beside it: the updater checks the download against it
          # (and against GitHub's own record of the file, when it has one).
          $hash = (Get-FileHash -Algorithm SHA256 trackertools-windows-x64.zip).Hash.ToLower()
          "$hash  trackertools-windows-x64.zip" | Out-File -Encoding ascii -NoNewline trackertools-windows-x64.zip.sha256
          Get-ChildItem pkg, trackertools-windows-x64.zip, trackertools-windows-x64.zip.sha256 | Format-Table Name, Length
          Get-Content trackertools-windows-x64.zip.sha256
      - name: Publish
        if: env.RELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG trackertools-windows-x64.zip trackertools-windows-x64.zip.sha256 --clobber
          } else {
            # Its notes: the version's section of the changelog (crates/tt_app/CHANGES.md), else GitHub's list of pull requests.
            $ver = $env:TAG.TrimStart('v'); $in = $false; $notes = @()
            foreach ($l in Get-Content crates/tt_app/CHANGES.md) {
              if ($l.StartsWith('## ')) { $in = ($l.Substring(3).Trim() -eq $ver); continue }
              if ($in -and $l.Trim()) { $notes += $l }
            }
            if ($notes.Count -gt 0) {
              $notes -join "`n" | Out-File -Encoding utf8 notes.md
              gh release create $env:TAG trackertools-windows-x64.zip trackertools-windows-x64.zip.sha256 --title "trackertools $env:TAG" --notes-file notes.md
            } else {
              gh release create $env:TAG trackertools-windows-x64.zip trackertools-windows-x64.zip.sha256 --title "trackertools $env:TAG" --generate-notes
            }
          }

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: Rust 1.95
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup default 1.95
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/portable"
      - name: Build and package
        run: scripts/package_macos.sh --version "$TAG"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/trackertools-macos-arm64.zip dist/trackertools-macos-arm64.zip.sha256"
          # The Windows job can make the release first; then this one adds to it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "trackertools $TAG" --generate-notes || gh release upload "$TAG" $files --clobber
          fi
