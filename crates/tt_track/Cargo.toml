[package]
name = "tt_track"
description = "Automatic trackers for trackertools (M6): operators that read pixels in background jobs, guided by sketches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tt_core.workspace = true
tt_media.workspace = true
bevy_ecs.workspace = true
bevy_reflect.workspace = true
anyhow.workspace = true
tracing.workspace = true
blake3 = "1.8.7"
serde_json.workspace = true
png = "0.18"

# (Already in the tree through winit.) A Mac's cursor icons: AppKit's NSCursor.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSBitmapImageRep", "NSCursor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[dev-dependencies]
serde.workspace = true
ron = "0.12.2"
