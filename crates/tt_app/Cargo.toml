[package]
name = "tt_app"
description = "trackertools desktop app: eframe shell, panels, tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "trackertools"
path = "src/main.rs"

[dependencies]
tt_core.workspace = true
tt_media.workspace = true
tt_track.workspace = true
bevy_ecs.workspace = true
bevy_reflect.workspace = true
egui.workspace = true
eframe.workspace = true
egui_tiles.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.17"
sha2 = "0.10"
png = "0.18"

[dev-dependencies]
# (Already in the tree through egui: reads the fonts' character maps for the glyph test.)
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }

# (Already in the tree.) Recovery waits for the old process to exit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# (Already in the tree through winit.) The pointer service: AppKit's mouse events.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSProcessInfo"] }
